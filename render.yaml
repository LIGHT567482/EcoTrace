services:
  - type: web
    name: ecotrace-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && pip install gunicorn && python manage.py migrate --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOW_ALL
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: USE_SQLITE
        value: "0"
      - key: DB_NAME
        fromDatabase:
          name: ecotrace-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ecotrace-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecotrace-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: ecotrace-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ecotrace-db
          property: port
      - key: ECOTRACE_ADMIN_PHONE
        sync: false
      - key: ECOTRACE_ADMIN_PASSWORD
        sync: false

databases:
  - name: ecotrace-db
    plan: free
    databaseName: ecotrace
